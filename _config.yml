# _config.yml

# Use the theme directly from its GitHub repository
remote_theme: pages-themes/architect@v0.2.0
plugins:
- jekyll-remote-theme

# --- Basic Site Settings ---
title: "Scifi Props"
description: "A central hub for the documentation of all my projects."
url: "https://templar66.github.io"

# --- Theme Settings ---
# Enable dark mode by default
color_scheme: dark

# --- Footer Settings ---
# Show "Last edited on..." on pages with a 'last_modified_date'
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y" # e.g., "Jul 11, 2025"

# Adds an "Edit this page on GitHub" link to the footer
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/Templar66/templar66.github.io"
gh_edit_branch: "main"

# Variables
baseurl: "/ScifiProps"
imagesurl: "/gallery/images/"
thumbsurl: "/gallery/thumbnails/"
